name: APK Android

# À chaque push dans mobile/ sur main, selon la version de mobile/pubspec.yaml (« 1.1.0+2 ») :
# - version jamais publiée : nouvelle APK, publiée en Release GitHub « v1.1.0+2 » avec version.json.
#   L'application la propose d'elle-même (mobile/lib/mise_a_jour.dart) ;
# - version déjà publiée avec Shorebird : correctif Shorebird de cette version (code Dart seulement),
#   appliqué sur les téléphones au lancement suivant ;
# - sinon : APK de contrôle en artefact, rien n'est distribué.
# Shorebird s'active avec le seul secret SHOREBIRD_TOKEN : le premier run crée l'application chez Shorebird
# (shorebird init) et commite mobile/shorebird.yaml. Rien n'est à installer sur le poste.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/apk.yml']
  workflow_dispatch:

# Créer les Releases et leurs tags.
permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      GH_TOKEN: ${{ github.token }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      # Version de Flutter des releases Shorebird ; un correctif reprend toujours celle de sa release.
      FLUTTER_SHOREBIRD: 3.44.9
      # L'adresse de l'API se règle dans Settings > Secrets and variables > Actions > Variables (API_URL)
      API_URL: ${{ vars.API_URL || 'https://cetic-mezesse-api-dgfxfucegjg8gscb.francecentral-01.azurewebsites.net/api' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Shorebird (près de 3 Go) s'installe ici, sur la machine de GitHub, jamais sur le poste.
      - name: Shorebird
        if: env.SHOREBIRD_TOKEN != ''
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # Une seule fois : crée l'application chez Shorebird et commite shorebird.yaml sur la branche.
      # En cas d'échec, la suite continue sans Shorebird (APK classique) et l'erreur reste visible.
      - name: Initialisation de Shorebird
        if: env.SHOREBIRD_TOKEN != '' && hashFiles('mobile/shorebird.yaml') == ''
        continue-on-error: true
        env:
          # Seulement si le compte Shorebird a plusieurs organisations (Settings > Variables : SHOREBIRD_ORG_ID).
          SHOREBIRD_ORG_ID: ${{ vars.SHOREBIRD_ORG_ID }}
        run: |
          # shorebird init exige android/gradlew, que le dépôt ne garde pas : Flutter le recrée sans rien compiler.
          flutter build apk --config-only
          shorebird init --display-name "CETIC Mezesse" ${SHOREBIRD_ORG_ID:+--org-id "$SHOREBIRD_ORG_ID"}
          if [ ! -f shorebird.yaml ]; then
            echo "::warning::shorebird init n'a pas créé shorebird.yaml : APK construite sans Shorebird."
            exit 1
          fi
          cat shorebird.yaml
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml android/app/src/main/AndroidManifest.xml
          git commit -m "Mobile : Shorebird initialisé" -m "Application créée chez Shorebird et shorebird.yaml ajouté par le workflow APK Android."
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::warning::shorebird.yaml n'a pas pu être poussé : commitez à la main le contenu affiché plus haut, sans relancer d'initialisation (elle créerait une seconde application)."
            exit 1
          fi

      - name: Version et mode de publication
        id: mode
        run: |
          version=$(sed -n 's/^version: *\([^ #]*\).*/\1/p' pubspec.yaml)
          nom=${version%%+*}
          numero=${version##*+}
          if ! [[ "$numero" =~ ^[0-9]+$ ]] || [ "$nom" = "$version" ]; then
            echo "::error::La version de pubspec.yaml doit avoir la forme 1.2.0+5 : « $version »"
            exit 1
          fi
          tag="v$version"
          shorebird=non
          if [ -f shorebird.yaml ] && [ -n "$SHOREBIRD_TOKEN" ]; then shorebird=oui; fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mode=release
          elif [ "$shorebird" = oui ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx shorebird.txt; then
            mode=patch
          else
            mode=controle
          fi
          case $mode in
            release) echo "::notice::Nouvelle APK $version (Shorebird : $shorebird)" ;;
            patch) echo "::notice::Correctif Shorebird de la version $version" ;;
            controle) echo "::notice::Version $version déjà publiée sans Shorebird : APK de contrôle seulement. Augmentez la version de pubspec.yaml pour la distribuer." ;;
          esac
          {
            echo "version=$version"
            echo "nom=$nom"
            echo "numero=$numero"
            echo "tag=$tag"
            echo "mode=$mode"
            echo "shorebird=$shorebird"
            echo "defines=--dart-define=VERSION=${GITHUB_SHA::7} --dart-define=API_URL=$API_URL --dart-define=BUILD=$numero --dart-define=NOM_VERSION=$nom"
          } >> "$GITHUB_OUTPUT"

      # Clé de publication tirée des secrets du dépôt (Settings > Secrets and variables > Actions > Secrets).
      # Elle ne doit jamais changer : Android refuse une mise à jour signée avec une autre clé.
      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # L'alias n'est pas sensible : accepté en secret ou en variable.
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets de signature manquants : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Le démarrage ne doit jamais rester bloqué (test/demarrage_test.dart).
      - run: flutter test

      - name: Construction de l'APK
        if: steps.mode.outputs.mode != 'patch'
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = release ] && [ "${{ steps.mode.outputs.shorebird }}" = oui ]; then
            # APK Shorebird : elle pourra recevoir les correctifs de cette version.
            shorebird release android --artifact apk --flutter-version="$FLUTTER_SHOREBIRD" ${{ steps.mode.outputs.defines }}
          else
            flutter build apk --release ${{ steps.mode.outputs.defines }}
          fi
          apk=$(find build/app/outputs -name 'app-release.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::APK introuvable après la construction"
            exit 1
          fi
          cp "$apk" cetic-mezesse.apk

      # Refuse un APK signé avec la clé de débogage.
      - name: Vérification de la signature
        if: steps.mode.outputs.mode != 'patch'
        run: |
          certificat=$(keytool -printcert -jarfile cetic-mezesse.apk)
          echo "$certificat" | grep -E "Owner|Propriétaire|SHA256" || true
          if echo "$certificat" | grep -q "CN=Android Debug"; then
            echo "::error::L'APK est signé avec la clé de débogage."
            exit 1
          fi

      - name: Publication de la Release
        if: steps.mode.outputs.mode == 'release'
        run: |
          tag="${{ steps.mode.outputs.tag }}"
          # Version minimale et notes : mobile/mise-a-jour.json ; à défaut, le titre du commit.
          minimum=$(jq -r '.minimum // 0' mise-a-jour.json)
          notes=$(jq -r '.notes // ""' mise-a-jour.json)
          [ -n "$notes" ] || notes=$(git log -1 --format=%s)
          jq -n \
            --argjson numero "${{ steps.mode.outputs.numero }}" \
            --arg nom "${{ steps.mode.outputs.nom }}" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/${tag//+/%2B}/cetic-mezesse.apk" \
            --argjson taille "$(stat -c%s cetic-mezesse.apk)" \
            --argjson minimum "$minimum" \
            --arg notes "$notes" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{numero: $numero, nom: $nom, url: $url, taille: $taille, minimum: $minimum, notes: $notes, commit: $commit, date: $date}' > version.json
          cat version.json
          fichiers=(cetic-mezesse.apk version.json)
          # Marque une APK Shorebird : les pushs suivants de cette version deviennent des correctifs.
          if [ "${{ steps.mode.outputs.shorebird }}" = oui ]; then
            echo "Construite avec Shorebird (Flutter $FLUTTER_SHOREBIRD)" > shorebird.txt
            fichiers+=(shorebird.txt)
          fi
          gh release create "$tag" "${fichiers[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Version ${{ steps.mode.outputs.nom }} (${{ steps.mode.outputs.numero }})" --notes "$notes" --latest

      - name: Correctif Shorebird
        if: steps.mode.outputs.mode == 'patch'
        run: shorebird patch android --release-version "${{ steps.mode.outputs.version }}" ${{ steps.mode.outputs.defines }}

      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.mode != 'patch'
        with:
          name: cetic-mezesse-apk
          path: mobile/cetic-mezesse.apk
